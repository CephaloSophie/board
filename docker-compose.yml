services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/board
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 30d
      PORT: 4000
      CLIENT_ORIGIN: "*"
    ports:
      - "4000:4000"

volumes:
  mongo_data:
