# board.kantoaplo.com — étape provisoire (HTTP seul) le temps d'obtenir le certificat Let's Encrypt.
# Installée puis remplacée automatiquement par deploy/vps/setup-https.sh. Ne concerne QUE ce nom de domaine.
server {
    listen 80;
    server_name board.kantoaplo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 503 "board.kantoaplo.com : certificat HTTPS en cours d'installation.\n";
        default_type text/plain;
    }
}
