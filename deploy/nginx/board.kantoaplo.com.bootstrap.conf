# Étape 1 (avant le certificat) : HTTP seul, sert le défi Let's Encrypt et l'application.
# Remplacée par board.kantoaplo.com.conf dès que le certificat existe (deploy/vps/setup-https.sh).
server {
    listen 80;
    listen [::]:80;
    server_name board.kantoaplo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://127.0.0.1:7002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
