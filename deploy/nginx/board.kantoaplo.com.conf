# Kýdos Board — https://board.kantoaplo.com
# /etc/nginx/sites-available/board.kantoaplo.com  (lien dans sites-enabled)
# Certificat Let's Encrypt : deploy/vps/setup-https.sh  ·  guide : VPSCONFIGURATION.md
#
#   /api/*  → kydos-server (PM2) 127.0.0.1:7002   API, imports Jira (25 Mo), images (8 Mo)
#   /*      → kydos-client (PM2) 127.0.0.1:7001   front construit (client/dist)

upstream kydos_api {
    server 127.0.0.1:7002;
    keepalive 16;
}

upstream kydos_web {
    server 127.0.0.1:7001;
    keepalive 16;
}

# HTTP : défi Let's Encrypt, tout le reste redirigé vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name board.kantoaplo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name board.kantoaplo.com;

    # --- TLS (Let's Encrypt, profil « intermediate » Mozilla, sans DHE : pas de dhparam) ---
    ssl_certificate     /etc/letsencrypt/live/board.kantoaplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/board.kantoaplo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KydosTLS:10m;
    ssl_session_tickets off;

    # --- En-têtes de sécurité (HSTS limité à ce sous-domaine : pas de includeSubDomains) ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/board.kantoaplo.com.access.log;
    error_log  /var/log/nginx/board.kantoaplo.com.error.log warn;

    # Imports Jira jusqu'à 25 Mo (JSON), images 8 Mo (base64 ≈ 11 Mo).
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # En-têtes transmis aux deux applications (hérités par les locations ci-dessous).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # API : directement vers kydos-server (imports longs, envois d'images).
    location /api/ {
        proxy_pass http://kydos_api;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /healthz {
        proxy_pass http://kydos_web;
        access_log off;
    }

    # Front (SPA) : fichiers de client/dist, cache géré par client/serve.cjs.
    location / {
        proxy_pass http://kydos_web;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
