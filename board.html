<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kýdos Belote — Board Agile</title>
<style>
  :root {
    --bg:#070c17; --panel:#0d1424; --panel-2:#111a2e; --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.15); --text:#e8ecf4; --soft:#a9b4c9; --mute:#6c7891;
    --gold:#e6c46a; --success:#7ecb98; --danger:#e85d70; --info:#6b78ea; --violet:#b39ddb;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --ui:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#0b1120,#05070f 70%);color:var(--text);font-family:var(--ui);min-height:100vh}
  a{color:var(--gold)}
  header{position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);background:rgba(6,10,20,.82);border-bottom:1px solid var(--line);padding:14px 22px}
  .brand{font-weight:800;font-size:18px;letter-spacing:.01em}
  .brand b{color:var(--gold)}
  .sub{font-size:11px;color:var(--mute);font-family:var(--mono)}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:96px}
  .kpi .v{font-family:var(--mono);font-size:19px;font-weight:700}
  .kpi .l{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin-top:2px}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:14px 22px;border-bottom:1px solid var(--line)}
  .ctrl{display:flex;flex-direction:column;gap:5px}
  .ctrl label{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
  select,input[type=text]{background:var(--panel);border:1px solid var(--line-strong);color:var(--text);border-radius:8px;padding:8px 11px;font-family:var(--mono);font-size:12px}
  input[type=text]{min-width:220px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--soft);cursor:pointer;user-select:none}
  .chip.active{color:#1a1406;background:var(--gold);border-color:var(--gold);font-weight:700}
  .chip.reset{border-style:dashed}
  main{padding:18px 22px 60px}
  .group{margin-bottom:26px}
  .group__head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .group__title{font-size:14px;font-weight:700}
  .group__meta{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-left:auto}
  .columns{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .col{background:rgba(13,20,36,.5);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:60px}
  .col__head{display:flex;align-items:center;gap:8px;margin-bottom:9px;padding:2px 4px}
  .col__dot{width:9px;height:9px;border-radius:50%}
  .col__name{font-size:11px;font-weight:700;letter-spacing:.04em}
  .col__count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--mute)}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,transform .05s}
  .card:hover{border-color:var(--line-strong)}
  .card:active{transform:scale(.995)}
  .card__top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .card__id{font-family:var(--mono);font-size:9.5px;color:var(--mute)}
  .card__pri{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:5px;font-weight:700}
  .card__title{font-size:12.5px;font-weight:600;line-height:1.32;margin-bottom:7px}
  .card__tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
  .tag.pts{border-color:rgba(230,196,106,.4);color:var(--gold)}
  .tag.dur{border-color:rgba(107,120,234,.4);color:var(--info)}
  .tag.type{border-color:rgba(126,203,152,.35);color:var(--success)}
  .empty{color:var(--mute);font-size:11px;padding:14px;text-align:center}
  .backdrop{position:fixed;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
  .backdrop.on{display:flex}
  .modal{background:linear-gradient(180deg,#101627,#0a0e1a);border:1px solid var(--line-strong);border-radius:16px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px;box-shadow:0 30px 80px -20px #000}
  .modal h3{margin:2px 0 4px;font-size:18px}
  .modal .m-id{font-family:var(--mono);font-size:11px;color:var(--mute)}
  .modal .m-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .modal .m-sec{margin-top:14px}
  .modal .m-sec h4{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
  .modal p{font-size:13px;line-height:1.55;color:var(--soft);margin:0 0 8px}
  .modal ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--soft);line-height:1.6}
  .modal .hist{font-family:var(--mono);font-size:11px;color:var(--mute);border-left:2px solid var(--line-strong);padding:3px 0 3px 10px;margin:4px 0}
  .modal .close{position:sticky;top:0;float:right;background:var(--panel);border:1px solid var(--line-strong);color:var(--soft);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12px}
  .loadbox{background:var(--panel);border:1px dashed var(--line-strong);border-radius:12px;padding:22px;color:var(--soft);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
    <span class="brand"><b>Kýdos</b> Belote — Board Agile</span>
    <span class="sub" id="meta-line">chargement…</span>
  </div>
  <div class="kpis" id="kpis"></div>
</header>
<div class="controls">
  <div class="ctrl">
    <label>Regrouper par</label>
    <select id="group-by">
      <option value="status">Statut (colonnes)</option>
      <option value="version">Version</option>
      <option value="category">Catégorie</option>
      <option value="techno">Techno</option>
      <option value="type">Type</option>
      <option value="priority">Priorité</option>
      <option value="area">Domaine</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Recherche</label>
    <input type="text" id="search" placeholder="id, titre, module…" />
  </div>
  <div class="ctrl" style="flex:1"><label>Filtres statut</label><div class="chips" id="filter-status"></div></div>
  <div class="ctrl" style="flex:1"><label>Filtres priorité</label><div class="chips" id="filter-priority"></div></div>
  <div class="ctrl" style="flex:1"><label>Filtres type</label><div class="chips" id="filter-type"></div></div>
  <div class="ctrl" style="flex:1"><label>Filtres catégorie</label><div class="chips" id="filter-category"></div></div>
  <div class="ctrl" style="flex:1"><label>Filtres techno</label><div class="chips" id="filter-techno"></div></div>
  <div class="ctrl" style="flex:1"><label>Filtres version</label><div class="chips" id="filter-version"></div></div>
</div>
<main id="board"><div class="loadbox">Chargement de <code>tasks.json</code>…</div></main>
<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
<script>
(function(){
  var DATA=null;
  var STATUS_ORDER=['draft','bug','pending','onprocess','needreview','tested','needconfirmation','finished','confirmed','refused'];
  var filters={status:new Set(),priority:new Set(),type:new Set(),category:new Set(),techno:new Set(),version:new Set()};
  var groupBy='status';var search='';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]});}
  function statusMeta(id){return (DATA.meta.statuses||[]).find(function(x){return x.id===id;})||{id:id,label:id,color:'#888'};}
  function priMeta(id){return (DATA.meta.priorities||[]).find(function(x){return x.id===id;})||{id:id,label:id,color:'#888'};}
  function pointsOf(t){return t.complexity||0;}
  function hoursOf(t){var d=(t.duration||'').match(/([\d.]+)\s*(h|j)/);if(!d)return 0;var v=parseFloat(d[1]);return d[2]==='j'?v*8:v;}
  function fmtDur(h){if(h<8)return (Math.round(h*10)/10)+' h';var j=h/8;return (Math.round(j*10)/10)+' j';}
  function buildChips(cid,dim,values){
    var el=document.getElementById(cid);el.innerHTML='';
    values.forEach(function(v){
      var chip=document.createElement('span');chip.className='chip';chip.textContent=v;
      chip.onclick=function(){if(filters[dim].has(v))filters[dim].delete(v);else filters[dim].add(v);chip.classList.toggle('active');render();};
      el.appendChild(chip);
    });
    if(values.length){var reset=document.createElement('span');reset.className='chip reset';reset.textContent='✕ tout';
      reset.onclick=function(){filters[dim].clear();el.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});render();};el.appendChild(reset);}
  }
  function distinct(f){var s=new Set();DATA.tasks.forEach(function(t){s.add(t[f]);});return Array.from(s).filter(Boolean);}
  function passesFilters(t){
    if(filters.status.size&&!filters.status.has(t.status))return false;
    if(filters.priority.size&&!filters.priority.has(t.priority))return false;
    if(filters.type.size&&!filters.type.has(t.type))return false;
    if(filters.category.size&&!filters.category.has(t.category))return false;
    if(filters.techno.size&&!filters.techno.has(t.techno))return false;
    if(filters.version.size&&!filters.version.has(t.version))return false;
    if(search){var hay=(t.id+' '+t.title+' '+t.module+' '+(t.description||'')).toLowerCase();if(hay.indexOf(search)===-1)return false;}
    return true;
  }
  function card(t){
    var pm=priMeta(t.priority);var div=document.createElement('div');div.className='card';
    div.innerHTML='<div class="card__top"><span class="card__id">'+esc(t.id)+'</span>'+
      '<span class="card__pri" style="background:'+pm.color+'22;color:'+pm.color+'">'+esc(t.priority)+'</span></div>'+
      '<div class="card__title">'+esc(t.title)+'</div>'+
      '<div class="card__tags"><span class="tag type">'+esc(t.type)+'</span>'+
      '<span class="tag">'+esc(t.category)+'</span><span class="tag">'+esc(t.techno)+'</span>'+
      '<span class="tag pts">'+pointsOf(t)+' pts</span><span class="tag dur">'+esc(t.duration||'—')+'</span>'+
      '<span class="tag">v'+esc(t.version)+'</span></div>';
    div.onclick=function(){openModal(t);};return div;
  }
  function render(){
    var board=document.getElementById('board');board.innerHTML='';
    var visible=DATA.tasks.filter(passesFilters);
    if(groupBy==='status'){renderStatusColumns(board,visible,'Toutes les tâches filtrées');}
    else{
      var groups={};visible.forEach(function(t){var k=t[groupBy]||'—';(groups[k]=groups[k]||[]).push(t);});
      var keys=Object.keys(groups);
      if(groupBy==='version')keys.sort(function(a,b){return b.localeCompare(a,undefined,{numeric:true});});
      else keys.sort();
      keys.forEach(function(k){renderStatusColumns(board,groups[k],labelFor(groupBy,k));});
    }
    if(!visible.length)board.innerHTML='<div class="empty">Aucune tâche ne correspond aux filtres.</div>';
    updateKpis(visible);
  }
  function labelFor(dim,k){if(dim==='version')return 'Version '+k;if(dim==='priority'){return k+' · '+priMeta(k).label;}return k;}
  function renderStatusColumns(board,tasks,title){
    var group=document.createElement('div');group.className='group';
    var pts=tasks.reduce(function(a,t){return a+pointsOf(t);},0);
    var hrs=tasks.reduce(function(a,t){return a+hoursOf(t);},0);
    group.innerHTML='<div class="group__head"><span class="group__title">'+esc(title)+'</span>'+
      '<span class="group__meta">'+tasks.length+' tâches · '+pts+' pts · '+fmtDur(hrs)+'</span></div>';
    var byStatus={};tasks.forEach(function(t){(byStatus[t.status]=byStatus[t.status]||[]).push(t);});
    var statuses=STATUS_ORDER.filter(function(s){return byStatus[s];});
    Object.keys(byStatus).forEach(function(s){if(statuses.indexOf(s)===-1)statuses.push(s);});
    var cols=document.createElement('div');cols.className='columns';
    statuses.forEach(function(s){
      var sm=statusMeta(s);
      var list=byStatus[s].slice().sort(function(a,b){return a.priority.localeCompare(b.priority)||a.id.localeCompare(b.id);});
      var col=document.createElement('div');col.className='col';
      var cpts=list.reduce(function(a,t){return a+pointsOf(t);},0);
      col.innerHTML='<div class="col__head"><span class="col__dot" style="background:'+sm.color+'"></span>'+
        '<span class="col__name" style="color:'+sm.color+'">'+esc(sm.label)+'</span>'+
        '<span class="col__count">'+list.length+' · '+cpts+'pts</span></div>';
      list.forEach(function(t){col.appendChild(card(t));});cols.appendChild(col);
    });
    group.appendChild(cols);board.appendChild(group);
  }
  function updateKpis(visible){
    var all=DATA.tasks;
    var done=all.filter(function(t){return ['finished','confirmed','tested'].indexOf(t.status)>=0;}).length;
    var wip=all.filter(function(t){return ['onprocess','needreview','needconfirmation'].indexOf(t.status)>=0;}).length;
    var todo=all.filter(function(t){return ['pending','draft'].indexOf(t.status)>=0;}).length;
    var bugs=all.filter(function(t){return t.type==='bug'||t.status==='bug';}).length;
    var p0=all.filter(function(t){return t.priority==='P0'&&['finished','confirmed','tested'].indexOf(t.status)<0;}).length;
    var totalPts=all.reduce(function(a,t){return a+pointsOf(t);},0);
    var totalHrs=all.reduce(function(a,t){return a+hoursOf(t);},0);
    var visPts=visible.reduce(function(a,t){return a+pointsOf(t);},0);
    var k=document.getElementById('kpis');
    function kpi(v,l,c){return '<div class="kpi"><div class="v" style="color:'+(c||'var(--text)')+'">'+v+'</div><div class="l">'+l+'</div></div>';}
    k.innerHTML=kpi(all.length,'Tâches')+kpi(done,'Terminées','var(--success)')+kpi(wip,'En cours','var(--gold)')+
      kpi(todo,'À faire','var(--info)')+kpi(bugs,'Bugs','var(--danger)')+kpi(p0,'P0 ouvertes','var(--danger)')+
      kpi(totalPts,'Points totaux','var(--gold)')+kpi(fmtDur(totalHrs),'Durée totale','var(--info)')+
      kpi(visible.length+' · '+visPts+'pts','Vue filtrée','var(--violet)');
  }
  function openModal(t){
    var sm=statusMeta(t.status),pm=priMeta(t.priority);var m=document.getElementById('modal');
    var hist=(t.history||[]).map(function(h){return '<div class="hist">'+esc(new Date(h.at).toLocaleString('fr-FR'))+' · <b style="color:'+statusMeta(h.status).color+'">'+esc(statusMeta(h.status).label)+'</b> ('+esc(h.by)+') — '+esc(h.note||'')+'</div>';}).join('');
    var instr=(t.instructions||[]).map(function(i){return '<li>'+esc(i)+'</li>';}).join('');
    var acc=(t.acceptance||[]).map(function(a){return '<li>'+esc(a)+'</li>';}).join('');
    m.innerHTML='<button class="close" onclick="document.getElementById(\'backdrop\').classList.remove(\'on\')">Fermer ✕</button>'+
      '<div class="m-id">'+esc(t.id)+' · '+esc(t.spec||'')+'</div><h3>'+esc(t.title)+'</h3>'+
      '<div class="m-row"><span class="tag" style="border-color:'+sm.color+';color:'+sm.color+'">'+esc(sm.label)+'</span>'+
      '<span class="tag" style="border-color:'+pm.color+';color:'+pm.color+'">'+esc(t.priority)+' · '+esc(pm.label)+'</span>'+
      '<span class="tag type">'+esc(t.type)+'</span><span class="tag">'+esc(t.category)+'</span>'+
      '<span class="tag">'+esc(t.techno)+'</span><span class="tag">'+esc(t.area)+' / '+esc(t.module)+'</span>'+
      '<span class="tag pts">'+pointsOf(t)+' pts</span><span class="tag dur">'+esc(t.duration||'—')+'</span>'+
      '<span class="tag">v'+esc(t.version)+'</span></div>'+
      (t.description?'<div class="m-sec"><h4>Description</h4><p>'+esc(t.description)+'</p></div>':'')+
      (instr?'<div class="m-sec"><h4>Instructions</h4><ul>'+instr+'</ul></div>':'')+
      (acc?'<div class="m-sec"><h4>Critères d\'acceptation</h4><ul>'+acc+'</ul></div>':'')+
      (hist?'<div class="m-sec"><h4>Historique</h4>'+hist+'</div>':'');
    document.getElementById('backdrop').classList.add('on');
  }
  document.getElementById('backdrop').onclick=function(e){if(e.target===this)this.classList.remove('on');};
  function boot(){
    document.getElementById('meta-line').textContent=DATA.meta.project+' · v'+DATA.meta.currentVersion+' · '+DATA.tasks.length+' tâches · généré '+new Date(DATA.meta.generatedAt).toLocaleString('fr-FR');
    buildChips('filter-status','status',STATUS_ORDER.filter(function(s){return distinct('status').indexOf(s)>=0;}));
    buildChips('filter-priority','priority',['P0','P1','P2','P3'].filter(function(p){return distinct('priority').indexOf(p)>=0;}));
    buildChips('filter-type','type',distinct('type').sort());
    buildChips('filter-category','category',distinct('category').sort());
    buildChips('filter-techno','techno',distinct('techno').sort());
    buildChips('filter-version','version',distinct('version').sort(function(a,b){return b.localeCompare(a,undefined,{numeric:true});}));
    document.getElementById('group-by').onchange=function(e){groupBy=e.target.value;render();};
    document.getElementById('search').oninput=function(e){search=e.target.value.toLowerCase();render();};
    render();
  }
  fetch('tasks.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){DATA=d;boot();})
    .catch(function(){
      document.getElementById('board').innerHTML='<div class="loadbox"><b>Impossible de lire <code>tasks.json</code> automatiquement.</b><br>'+
        "C'est normal si la page est ouverte depuis le disque (file://). Sélectionnez le fichier, ou servez le dossier : <code>npx serve board</code>.<br><br>"+
        '<input type="file" id="picker" accept="application/json" /></div>';
      document.getElementById('picker').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){DATA=JSON.parse(rd.result);boot();};rd.readAsText(f);});
    });
})();
</script>
</body>
</html>
